name: Test Reed push notification
on:
  workflow_dispatch:
permissions:
  issues: write
jobs:
  notify:
    if: github.repository == 'reedrice/goggins-of-gambling' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send a labeled test mention and assignment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/reedrice/goggins-of-gambling/issues --method POST --input - <<'JSON'
          {"title":"TEST ONLY: Men in Black iPhone push notification","assignees":["reedrice"],"body":"@reedrice This is the lock-screen notification test you requested. The site is not reporting an outage. If this appears on your iPhone lock screen, mentions/assignments from the Actions bot are reaching your phone. You may close this test issue after checking."}
          JSON
