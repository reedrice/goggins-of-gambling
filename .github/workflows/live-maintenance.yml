name: Live feed and grading
on:
  schedule:
    - cron: '1-56/5 * * * *'
  workflow_dispatch:
    inputs:
      takeover:
        description: 'Transfer the ChatGPT feed owner after a successful run'
        type: boolean
        default: false
      routines_takeover:
        description: 'Transfer and test the five former Grok routines'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-site
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'reedrice/goggins-of-gambling' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: read
    outputs:
      updated: ${{ steps.refresh.outputs.updated }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Refresh, grade and publish public data
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_TAKEOVER: ${{ github.event_name == 'workflow_dispatch' && inputs.takeover }}
          ACTIONS_ROUTINES_TAKEOVER: ${{ github.event_name == 'workflow_dispatch' && inputs.routines_takeover }}
        run: node scripts/actions-maintenance.mjs
      - name: Prepare static site
        if: steps.refresh.outputs.updated == 'true'
        run: node scripts/prepare-pages.mjs
      - name: Upload site
        if: steps.refresh.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .cache/pages
  deploy:
    needs: refresh
    if: needs.refresh.outputs.updated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

