<!doctype html>
<!--
  index.html — the only page of this static single-page app.

  PURPOSE
    Provides the DOM skeleton: the first-run onboarding overlay, the header,
    one <section> per tab (Picks, Calculator, Bets, Record, Fade Trent, Settings) and the
    bottom tab bar. All content is rendered by js/app.js.

  BRANDING
    No brand strings are hardcoded here. Elements with data-brand="appName"
    / "tagline" are filled from window.APP_CONFIG (config.js), and
    document.title is set at runtime. Rename in config.js. Every other
    user-facing word comes from js/strings.js.

  SCRIPT ORDER (plain classic scripts, no bundler; each attaches one global)
    config.js -> strings.js -> calc.js -> storage.js -> gametime.js -> evaluate.js -> teams.js ->
    positions.js -> markets-core.js -> picker-filters.js -> picker-groups.js -> picker.js -> github-log.js -> live-bets.js (Richie) -> app.js
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E17">
  <meta name="robots" content="noindex">
  <!-- Don't keep a stale copy of this page (helps; the real fix is the version check below, HANDOFF §49). -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- AUTO UPDATE CHECK (HANDOFF §49). APP_VERSION must equal version.json and every ?v= below.
       Bump all three with ONE command: node scripts/bump-version.mjs -->
  <script>
    window.APP_VERSION = '20261024-0247';
    (function () {
      var KEY = 'betdash_reloadedFor';
      function check() {
        if (!window.fetch) return;
        fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            var v = j && j.version;
            if (!v || v === window.APP_VERSION) return;
            var done = null; try { done = sessionStorage.getItem(KEY); } catch (e) {}
            if (done === v) return;                       // already reloaded once for this version: no loop
            try { sessionStorage.setItem(KEY, v); } catch (e) { return; }  // no storage = no reload (loop-safe)
            var u = new URL(location.href); u.searchParams.set('fresh', v);
            location.replace(u.toString());               // new URL = fresh index.html + new ?v= assets
          }).catch(function () {});
      }
      try { var cu = new URL(location.href); if (cu.searchParams.has('fresh')) { cu.searchParams.delete('fresh'); history.replaceState(history.state, '', cu.toString()); } } catch (e) {}
      check();
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
      window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });   // back/forward cache
    })();
  </script>
  <title>Loading…</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css?v=20261024-0247">
  <link rel="stylesheet" href="css/live-bets.css?v=20261024-0247">  <!-- Richie's area, HANDOFF §32 -->
  <link rel="stylesheet" href="css/theme.css?v=20261024-0247"> <!-- Global design tokens; must stay last. -->
</head>
<body>
  <!-- FIRST-RUN ONBOARDING: filled by app.js (text from js/strings.js) when no profile exists; blocks everything else. -->
  <div id="onboarding" class="onboarding" hidden></div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div>
        <div class="brand-name small" data-brand="appName"></div>
        <div class="brand-tag small" id="slogan" data-brand="tagline"></div>
      </div>
      <div class="topbar-bank">
        <div class="label" id="hdr-bank-label"></div>
        <div id="hdr-bankroll" class="value">—</div>
      </div>
    </header>
    <!-- "I bet on" toggle: same localStorage value as onboarding + Settings -->
    <div id="plat-toggle" class="plat-bar"></div>

    <main>
      <div class="header-data">
        <div id="picks-score-ticker"></div>
        <section id="daily-slate" aria-label="Daily Slate Overview"></section>
      </div>
      <section id="tab-picks" class="tab" data-tab="picks"></section>
      <section id="tab-calc" class="tab" data-tab="calc" hidden></section>
      <section id="tab-bets" class="tab" data-tab="bets" hidden></section>
      <section id="tab-record" class="tab" data-tab="record" hidden></section>
      <section id="tab-trent" class="tab" data-tab="trent" hidden></section>
      <section id="tab-settings" class="tab" data-tab="settings" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <!-- labels come from STR.tabs -->
      <button data-go="picks" class="active"><span>🎯</span><b class="tl"></b></button>
      <button data-go="calc"><span>🧮</span><b class="tl"></b></button>
      <button data-go="bets"><span>💰</span><b class="tl"></b></button>
      <button data-go="record"><span>📈</span><b class="tl"></b></button>
      <button data-go="trent"><span>🙃</span><b class="tl"></b></button>
      <button data-go="settings"><span>⚙️</span><b class="tl"></b></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- tooltip bubble for (i) buttons -->
  <div id="tip-pop" class="tip-pop" role="tooltip" hidden></div>

  <script src="config.js?v=20261024-0247"></script>
  <script src="js/public-json.js?v=20261024-0247"></script>
  <script src="js/strings.js?v=20261024-0247"></script>
  <script src="js/calc.js?v=20261024-0247"></script>
  <script src="js/plain.js?v=20261024-0247"></script>
  <script src="js/vegas.js?v=20261024-0247"></script>
  <script src="js/trent.js?v=20261024-0247"></script>
  <script src="js/play.js?v=20261024-0247"></script>  <!-- play money (points), HANDOFF §34 -->
  <script src="js/athlete-flags.js?v=20261024-0247"></script>
  <script src="js/live-scoreboard.js?v=20261024-0247"></script>
  <script src="js/live-bets.js?v=20261024-0247"></script>  <!-- Richie's area, HANDOFF §32 -->
  <script src="js/storage.js?v=20261024-0247"></script>
  <script src="js/theme.js?v=20261024-0247"></script>
  <script src="js/gametime.js?v=20261024-0247"></script>
  <script src="js/evaluate.js?v=20261024-0247"></script>
  <script src="js/teams.js?v=20261024-0247"></script>
  <script src="js/positions.js?v=20261024-0247"></script>
  <script src="js/markets-core.js?v=20261024-0247"></script>
  <script src="js/picker-filters.js?v=20261024-0247"></script>
  <script src="js/picker-groups.js?v=20261024-0247"></script>
  <script src="js/live-feedback.js?v=20261024-0247"></script>
  <script src="js/record-log.js?v=20261024-0247"></script>
  <script src="js/combo-safety.js?v=20261024-0247"></script>
  <script src="js/combo-lab.js?v=20261024-0247"></script>
  <script src="js/picker.js?v=20261024-0247"></script>
  <script src="js/share.js?v=20261024-0247"></script>  <!-- Share a pick, HANDOFF §46 -->
  <script src="js/live-picks.js?v=20261024-0247"></script>  <!-- Picks "Refresh prices", HANDOFF §37 -->
  <script src="js/github-log.js?v=20261024-0247"></script>
  <script src="js/gh-auth.js?v=20261024-0247"></script>  <!-- GitHub sign-in (device flow), hidden until a Worker URL is set -->
  <script src="js/viz.js?v=20261024-0247"></script>
  <script src="js/our-chance.js?v=20261024-0247"></script>  <!-- Our chance blend, HANDOFF §56 -->  <!-- Tap-a-bet charts, HANDOFF §48 -->
  <script src="js/dig-deeper.js?v=20261024-0247"></script>  <!-- Dig deeper sheet, HANDOFF §57 -->
  <script src="js/picks-scores.js?v=20261024-0247"></script>
  <script src="js/daily-slate.js?v=20261024-0247"></script>
  <script src="js/tennis-scores.js?v=20261024-0247"></script>
  <script src="js/bet-progress.js?v=20261024-0247"></script>
  <script src="js/polymarket-sync.js?v=20261024-0247"></script>
  <script src="js/kalshi-sync.js?v=20261024-0247"></script>
  <script src="js/motion.js?v=20261024-0247"></script>
  <script src="js/app.js?v=20261024-0247"></script>
</body>
</html>
